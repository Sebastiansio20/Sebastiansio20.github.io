<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Workflow de automatización">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f2f5fb"/>
      <stop offset="100%" stop-color="#e8eef9"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#4a7fd6" opacity="0.25"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0e1c38" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa0b8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2fbf71"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff5d5d"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <g font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="12">

    <!-- Canvas labels -->
    <text x="58" y="70" fill="#7b879e" letter-spacing="2" font-size="10">TRIGGER</text>
    <text x="560" y="52" fill="#1f9d55" letter-spacing="2" font-size="10">SUCCESS</text>
    <text x="560" y="560" fill="#d0453f" letter-spacing="2" font-size="10">ERROR</text>

    <!-- Connections -->
    <g fill="none" stroke-width="2">
      <path d="M 210 129 C 250 129, 280 89, 320 89" stroke="#8fa0b8" marker-end="url(#arrow)"/>
      <path d="M 210 129 C 250 129, 280 249, 320 249" stroke="#8fa0b8" marker-end="url(#arrow)"/>
      <path d="M 490 89 C 530 89, 270 409, 320 409" stroke="#8fa0b8" marker-end="url(#arrow)"/>
      <path d="M 490 249 C 530 249, 270 409, 320 409" stroke="#8fa0b8" marker-end="url(#arrow)"/>
      <path d="M 490 409 C 530 409, 550 249, 590 249" stroke="#2fbf71" stroke-width="2.4" marker-end="url(#arrow-green)"/>
      <path d="M 490 89 C 530 89, 720 540, 700 540" stroke="#ff5d5d" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#arrow-red)"/>
    </g>

    <!-- Ports -->
    <g fill="#0e1c38" stroke="#8fa0b8" stroke-width="1.5">
      <circle cx="210" cy="129" r="5"/>
      <circle cx="320" cy="89" r="5"/>
      <circle cx="320" cy="249" r="5"/>
      <circle cx="490" cy="89" r="5"/>
      <circle cx="490" cy="249" r="5"/>
      <circle cx="320" cy="409" r="5"/>
      <circle cx="490" cy="409" r="5"/>
      <circle cx="590" cy="249" r="5"/>
      <circle cx="490" cy="429" r="5"/>
    </g>

    <!-- Webhook -->
    <g filter="url(#shadow)">
      <rect x="40" y="100" width="170" height="58" rx="7" fill="#ffffff" stroke="#dbe2ef"/>
      <rect x="40" y="100" width="170" height="16" rx="7" fill="#2fbf71"/>
      <rect x="40" y="112" width="170" height="4" fill="#2fbf71"/>
      <path d="M 52 108 l 9 -5 l -3 4 l 4 0 l -9 5 l 3 -4 z" fill="#ffffff"/>
      <text x="66" y="112" fill="#ffffff" font-weight="600" font-size="11">Webhook</text>
      <text x="52" y="136" fill="#5d6c86" font-size="10">event: new_row</text>
    </g>

    <!-- HTTP Request -->
    <g filter="url(#shadow)">
      <rect x="320" y="60" width="170" height="58" rx="7" fill="#ffffff" stroke="#dbe2ef"/>
      <rect x="320" y="60" width="170" height="16" rx="7" fill="#4a7fd6"/>
      <rect x="320" y="72" width="170" height="4" fill="#4a7fd6"/>
      <circle cx="335" cy="68" r="4" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <path d="M 333 68 h 4 M 335 66 v 4" stroke="#ffffff" stroke-width="1.3"/>
      <text x="345" y="72" fill="#ffffff" font-weight="600" font-size="11">HTTP Request</text>
      <text x="332" y="96" fill="#5d6c86" font-size="10">POST /api/webhook</text>
      <text x="332" y="110" fill="#8a96ab" font-size="9">retries: 3</text>
    </g>

    <!-- SQL Query -->
    <g filter="url(#shadow)">
      <rect x="320" y="220" width="170" height="58" rx="7" fill="#ffffff" stroke="#dbe2ef"/>
      <rect x="320" y="220" width="170" height="16" rx="7" fill="#7a5be8"/>
      <rect x="320" y="232" width="170" height="4" fill="#7a5be8"/>
      <ellipse cx="334" cy="228" rx="4.5" ry="2.6" fill="none" stroke="#ffffff" stroke-width="1.4"/>
      <path d="M 329.5 228 v 3 c 0 2.4 2 4.4 4.5 4.4 s 4.5 -2 4.5 -4.4 v -3" stroke="#ffffff" stroke-width="1.4" fill="none"/>
      <text x="344" y="232" fill="#ffffff" font-weight="600" font-size="11">SQL Query</text>
      <text x="332" y="256" fill="#5d6c86" font-size="10">SELECT * FROM orders</text>
      <text x="332" y="270" fill="#8a96ab" font-size="9">where status = 'pending'</text>
    </g>

    <!-- Filter -->
    <g filter="url(#shadow)">
      <rect x="320" y="380" width="170" height="58" rx="7" fill="#ffffff" stroke="#dbe2ef"/>
      <rect x="320" y="380" width="170" height="16" rx="7" fill="#f5a623"/>
      <rect x="320" y="392" width="170" height="4" fill="#f5a623"/>
      <path d="M 329 385 h 10 M 332 388 h 4 M 334 391 h 0" stroke="#0e1c38" stroke-width="1.4" fill="none"/>
      <path d="M 333 388 l 3 0 l -3 -2 l 3 0 l -3 -2" fill="none" stroke="#0e1c38" stroke-width="1.2"/>
      <text x="344" y="392" fill="#0e1c38" font-weight="600" font-size="11">Filter</text>
      <text x="332" y="416" fill="#5d6c86" font-size="10">total > 1000</text>
      <text x="332" y="430" fill="#8a96ab" font-size="9">and approved = true</text>
    </g>

    <!-- Send Email / Slack -->
    <g filter="url(#shadow)">
      <rect x="590" y="220" width="170" height="58" rx="7" fill="#ffffff" stroke="#dbe2ef"/>
      <rect x="590" y="220" width="170" height="16" rx="7" fill="#9b5fe8"/>
      <rect x="590" y="232" width="170" height="4" fill="#9b5fe8"/>
      <rect x="604" y="224" width="7" height="5" rx="1" fill="none" stroke="#ffffff" stroke-width="1.3"/>
      <path d="M 604 224 l 3.5 3 l 3.5 -3" stroke="#ffffff" stroke-width="1.3" fill="none"/>
      <text x="616" y="232" fill="#ffffff" font-weight="600" font-size="11">Send Email</text>
      <text x="602" y="256" fill="#5d6c86" font-size="10">to: finance@acme.com</text>
      <text x="602" y="270" fill="#8a96ab" font-size="9">attachment: report.pdf</text>
    </g>

    <!-- Error node -->
    <g filter="url(#shadow)">
      <rect x="660" y="522" width="120" height="44" rx="7" fill="#ffffff" stroke="#ffd7d5"/>
      <rect x="660" y="522" width="120" height="14" rx="7" fill="#ff5d5d"/>
      <rect x="660" y="532" width="120" height="4" fill="#ff5d5d"/>
      <text x="676" y="534" fill="#ffffff" font-weight="600" font-size="11">Error</text>
      <text x="674" y="554" fill="#8a96ab" font-size="9">notify / retry</text>
    </g>

  </g>
</svg>
