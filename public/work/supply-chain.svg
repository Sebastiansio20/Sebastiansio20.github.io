<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cadena de suministro: proveedores, fabricación, distribución y retail">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="55%" stop-color="#0e1c33"/>
      <stop offset="100%" stop-color="#13294e"/>
    </linearGradient>
    <pattern id="dots3" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#4a7fd6" opacity="0.35"/>
    </pattern>
    <pattern id="mapgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#2b4a7a" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <filter id="shadow3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8f9ab0"/>
    </marker>
    <marker id="arrow3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a7fd6"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect width="800" height="600" fill="url(#dots3)"/>

  <g font-family="Space Grotesk, Inter, system-ui, sans-serif" font-size="12">

    <!-- Map area -->
    <rect x="40" y="200" width="470" height="360" rx="10" fill="#0c1933" stroke="#2b4a7a" stroke-width="1.2" opacity="0.9"/>
    <rect x="40" y="200" width="470" height="360" rx="10" fill="url(#mapgrid)"/>

    <!-- Route lanes -->
    <g fill="none" stroke-width="1.8">
      <path d="M 140 500 C 220 420, 300 400, 360 320" stroke="#4a7fd6" opacity="0.9" marker-end="url(#arrow3b)"/>
      <path d="M 140 500 C 240 470, 320 470, 420 430" stroke="#8f9ab0" opacity="0.8" marker-end="url(#arrow3)"/>
      <path d="M 360 320 C 400 280, 430 260, 470 250" stroke="#8f9ab0" opacity="0.8" marker-end="url(#arrow3)"/>
      <path d="M 420 430 C 440 400, 450 380, 470 370" stroke="#3ddc84" stroke-width="2.2" opacity="0.9" stroke-dasharray="none" marker-end="url(#arrow3)"/>
    </g>

    <!-- Pulsing shipment dots on lanes -->
    <g fill="#7aa6e8">
      <circle cx="210" cy="455" r="6" opacity="0.95"/>
      <circle cx="300" cy="345" r="6" opacity="0.95"/>
      <circle cx="455" cy="265" r="5" opacity="0.9"/>
      <circle cx="385" cy="455" r="5" opacity="0.9"/>
    </g>
    <g fill="none" stroke="#7aa6e8" stroke-width="1" opacity="0.5">
      <circle cx="210" cy="455" r="13"/>
      <circle cx="300" cy="345" r="13"/>
      <circle cx="455" cy="265" r="11"/>
    </g>

    <!-- Origin (warehouse / port) -->
    <g filter="url(#shadow3)">
      <rect x="90" y="470" width="100" height="60" rx="8" fill="#14233c" stroke="#4a7fd6" stroke-width="1.5"/>
      <rect x="90" y="470" width="100" height="16" rx="8" fill="#4a7fd6"/>
      <rect x="90" y="482" width="100" height="4" fill="#4a7fd6"/>
      <path d="M 100 478 h 10 v 4 h -10 z M 103 478 v -4 h 4 v 4" fill="#0a1628"/>
      <text x="115" y="482" fill="#ffffff" font-weight="600" font-size="11">Port</text>
      <text x="100" y="508" fill="#8f9ab0" font-size="10">origin · CN</text>
    </g>

    <!-- Container stack -->
    <g>
      <rect x="58" y="390" width="52" height="26" rx="3" fill="#3f5c8a" stroke="#5b7bb5" stroke-width="1"/>
      <rect x="66" y="390" width="2" height="26" fill="#2b4a7a"/>
      <rect x="58" y="418" width="52" height="26" rx="3" fill="#2b4a7a" stroke="#5b7bb5" stroke-width="1"/>
      <rect x="66" y="418" width="2" height="26" fill="#1b2b4a"/>
      <text x="84" y="436" fill="#a8c4ee" font-size="8" text-anchor="middle">AGBA</text>
      <rect x="64" y="446" width="40" height="20" rx="3" fill="#1b2b4a" stroke="#4a7fd6" stroke-width="1.2"/>
      <text x="84" y="460" fill="#a8c4ee" font-size="8" text-anchor="middle">+5K TEU</text>
    </g>

    <!-- Destination nodes -->
    <g filter="url(#shadow3)">
      <rect x="330" y="280" width="130" height="54" rx="8" fill="#14233c" stroke="#f5a623" stroke-width="1.5"/>
      <rect x="330" y="280" width="130" height="16" rx="8" fill="#f5a623"/>
      <rect x="330" y="292" width="130" height="4" fill="#f5a623"/>
      <circle cx="344" cy="288" r="4" fill="none" stroke="#0a1628" stroke-width="1.4"/>
      <path d="M 342 288 h 4 M 344 286 v 4" stroke="#0a1628" stroke-width="1.3"/>
      <text x="352" y="292" fill="#0a1628" font-weight="600" font-size="11">Hub</text>
      <text x="340" y="318" fill="#8f9ab0" font-size="10">distribution</text>
    </g>
    <g filter="url(#shadow3)">
      <rect x="440" y="400" width="130" height="54" rx="8" fill="#14233c" stroke="#3ddc84" stroke-width="1.5"/>
      <rect x="440" y="400" width="130" height="16" rx="8" fill="#3ddc84"/>
      <rect x="440" y="412" width="130" height="4" fill="#3ddc84"/>
      <path d="M 452 406 l 5 -3 l -2 3 h 2 l -5 3 l 2 -3 z" fill="#0a1628"/>
      <text x="462" y="412" fill="#0a1628" font-weight="600" font-size="11">Retail</text>
      <text x="450" y="438" fill="#8f9ab0" font-size="10">customer · MX</text>
    </g>

    <!-- Stage cards -->
    <g filter="url(#shadow3)">
      <rect x="40" y="84" width="130" height="54" rx="8" fill="#14233c" stroke="#4a7fd6" stroke-width="1.4"/>
      <rect x="40" y="84" width="130" height="15" rx="8" fill="#4a7fd6"/>
      <rect x="40" y="95" width="130" height="4" fill="#4a7fd6"/>
      <circle cx="54" cy="91.5" r="4" fill="none" stroke="#0a1628" stroke-width="1.3"/>
      <text x="62" y="95" fill="#ffffff" font-weight="600" font-size="10.5">Suppliers</text>
      <text x="50" y="124" fill="#8f9ab0" font-size="10">45 vendors</text>
    </g>
    <path d="M 170 111 H 196" stroke="#8f9ab0" stroke-width="2" marker-end="url(#arrow3)"/>
    <g filter="url(#shadow3)">
      <rect x="210" y="84" width="130" height="54" rx="8" fill="#14233c" stroke="#7a5be8" stroke-width="1.4"/>
      <rect x="210" y="84" width="130" height="15" rx="8" fill="#7a5be8"/>
      <rect x="210" y="95" width="130" height="4" fill="#7a5be8"/>
      <ellipse cx="224" cy="91.5" rx="4" ry="2.6" fill="none" stroke="#0a1628" stroke-width="1.3"/>
      <path d="M 220 91.5 v 2.2 c 0 2.2 1.8 4 4 4 s 4 -1.8 4 -4 v -2.2" stroke="#0a1628" stroke-width="1.3" fill="none"/>
      <text x="232" y="95" fill="#ffffff" font-weight="600" font-size="10.5">Manufacturing</text>
      <text x="220" y="124" fill="#8f9ab0" font-size="10">3 plants</text>
    </g>
    <path d="M 340 111 H 366" stroke="#8f9ab0" stroke-width="2" marker-end="url(#arrow3)"/>
    <g filter="url(#shadow3)">
      <rect x="380" y="84" width="130" height="54" rx="8" fill="#14233c" stroke="#f5a623" stroke-width="1.4"/>
      <rect x="380" y="84" width="130" height="15" rx="8" fill="#f5a623"/>
      <rect x="380" y="95" width="130" height="4" fill="#f5a623"/>
      <path d="M 390 88 h 12 M 394 91 h 5 M 396 94 v 0" stroke="#0a1628" stroke-width="1.3" fill="none"/>
      <path d="M 395 91 l 3 0 l -3 -2 l 3 0 l -3 -2" fill="none" stroke="#0a1628" stroke-width="1.1"/>
      <text x="406" y="95" fill="#0a1628" font-weight="600" font-size="10.5">Distribution</text>
      <text x="390" y="124" fill="#8f9ab0" font-size="10">8 hubs</text>
    </g>
    <path d="M 510 111 H 536" stroke="#8f9ab0" stroke-width="2" marker-end="url(#arrow3)"/>
    <g filter="url(#shadow3)">
      <rect x="550" y="84" width="130" height="54" rx="8" fill="#14233c" stroke="#3ddc84" stroke-width="1.4"/>
      <rect x="550" y="84" width="130" height="15" rx="8" fill="#3ddc84"/>
      <rect x="550" y="95" width="130" height="4" fill="#3ddc84"/>
      <rect x="564" y="87" width="7" height="5" rx="1" fill="none" stroke="#0a1628" stroke-width="1.3"/>
      <path d="M 564 87 l 3.5 3 l 3.5 -3" stroke="#0a1628" stroke-width="1.3" fill="none"/>
      <text x="576" y="95" fill="#0a1628" font-weight="600" font-size="10.5">Retail</text>
      <text x="560" y="124" fill="#8f9ab0" font-size="10">120 stores</text>
    </g>

    <!-- Tracking panel -->
    <g filter="url(#shadow3)">
      <rect x="540" y="220" width="220" height="150" rx="10" fill="#101f36" stroke="#3f5c8a" stroke-width="1.4"/>
      <rect x="540" y="220" width="220" height="26" rx="10" fill="#1b2b4a"/>
      <rect x="540" y="236" width="220" height="10" fill="#1b2b4a"/>
      <circle cx="558" cy="233" r="5" fill="#4a7fd6"/>
      <text x="690" y="237" fill="#8f9ab0" font-size="10" text-anchor="end">live tracking</text>
      <g>
        <rect x="556" y="262" width="64" height="40" rx="6" fill="#14233c"/>
        <text x="565" y="278" fill="#a8c4ee" font-size="13" font-weight="700">96%</text>
        <text x="565" y="293" fill="#55637a" font-size="8">on-time</text>
        <rect x="626" y="262" width="64" height="40" rx="6" fill="#14233c"/>
        <text x="635" y="278" fill="#a8c4ee" font-size="13" font-weight="700">12d</text>
        <text x="635" y="293" fill="#55637a" font-size="8">lead time</text>
        <rect x="696" y="262" width="50" height="40" rx="6" fill="#14233c"/>
        <text x="705" y="278" fill="#a8c4ee" font-size="13" font-weight="700">-8%</text>
        <text x="705" y="293" fill="#55637a" font-size="8">stockout</text>
      </g>
      <g font-size="10">
        <circle cx="560" cy="330" r="4" fill="#3ddc84"/>
        <text x="572" y="334" fill="#dde4ef">MX-1042 · in transit</text>
        <circle cx="560" cy="352" r="4" fill="#f5a623"/>
        <text x="572" y="356" fill="#dde4ef">US-9981 · customs</text>
      </g>
    </g>

  </g>
</svg>
